services:
  bot:
    build: .
    container_name: uma-club-bot
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    environment:
      - API_PORT=3000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>{if(!j.success)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
